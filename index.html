<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NervoSound – Music Therapy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>NervoSound – Music Therapy</h1>

<!-- USERS -->
<section>
  <h2>Users</h2>
  <input id="newUserName" placeholder="Type a name (e.g., Raha)" />
  <button id="addUserBtn">Add / Select</button>

  <select id="userSelect"></select>
</section>

<hr>

<!-- SESSION -->
<section>
  <h2>Session</h2>

  <select id="freqSelect">
    <option value="432">Relaxation (432Hz)</option>
    <option value="852">Healing (852Hz)</option>
    <option value="963">Spiritual Awareness (963Hz)</option>
  </select>

  <br><br>

  <audio id="audio" controls></audio>

  <p>Listening time: <span id="liveSeconds">0</span> seconds</p>

  <label>Mood before (0–10)</label>
  <input id="moodBefore" type="number" min="0" max="10">

  <label>Mood after (0–10)</label>
  <input id="moodAfter" type="number" min="0" max="10">

  <br><br>
  <button id="saveSessionBtn">Save session</button>
</section>

<hr>

<!-- ANALYTICS -->
<section>
  <h2>Analytics</h2>
  <p>Total sessions: <span id="statTotal">0</span></p>
  <p>Average improvement: <span id="statAvg">0</span></p>
  <p>Most used frequency: <span id="statMost">—</span></p>
</section>

<hr>

<!-- TEST -->
<button id="testFirestoreBtn">TEST FIRESTORE</button>

<script type="module" src="./firebase.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
